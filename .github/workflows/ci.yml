name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- --deny warnings

      - name: Tests
        run: cargo test --workspace

      # The generated files are committed, so a template edited without a
      # re-render would otherwise ship stale themes with nothing to catch it.
      - name: Generated files are current
        run: make check

      - name: Port registry matches the tree
        run: python3 scripts/publish.py --check

      # Each port checked by the program that will read its theme. The image is
      # pulled when the registry has it and built once when it does not, so a
      # run does not reinstall seven programs from scratch.
      - name: Port tests
        run: |
          command -v podman >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq podman
          }
          podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          tests/run.sh

      - name: Publish the test image
        if: hashFiles('target/test-image-built') != ''
        run: podman push "$(cat target/test-image-built)"

      # Build the mirrors without pushing, so a pull request shows what each
      # port repository would receive.
      - name: Build mirrors
        run: python3 scripts/publish.py --out target/mirrors

      - uses: actions/upload-artifact@v7
        with:
          name: mirrors
          path: target/mirrors
          if-no-files-found: error
