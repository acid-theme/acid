# Acid 0.1.0 — Lactic, for Alacritty
#
# Generated by acid from ports/alacritty/theme.tera. Do not edit; edit
# the template, or the palette in crates/acid-palette/src/lib.rs, and re-run
# `make`.
#
# Import it from alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/acid-lactic.toml"]

[colors.primary]
background = "#ffffff"
foreground = "#3a3117"
dim_foreground = "#5f5647"
bright_foreground = "#493d1d"

[colors.cursor]
text = "#ffffff"
cursor = "#9c6a0e"

[colors.vi_mode_cursor]
text = "#ffffff"
cursor = "#4a8143"

[colors.search.matches]
foreground = "#ffffff"
background = "#706a5c"

[colors.search.focused_match]
foreground = "#ffffff"
background = "#9c6a0e"

[colors.hints.start]
foreground = "#ffffff"
background = "#9c6a0e"

[colors.hints.end]
foreground = "#ffffff"
background = "#706a5c"

# Chrome sits behind the editor field, so it follows the flavour's depth axis:
# mantle is lighter than base in acetic, darker in citric.
[colors.footer_bar]
foreground = "#4f4430"
background = "#f4f4f3"

[colors.line_indicator]
foreground = "#4f4430"
background = "#f4f4f3"

[colors.selection]
text = "#3a3117"
background = "#b4ada2"

# ANSI 0-7. `black` is a visible surface rather than the background, so that
# black-on-black text stays legible.
[colors.normal]
black = "#cbc6bf"
red = "#df2910"
green = "#737914"
yellow = "#9c6a0e"
blue = "#4978a4"
magenta = "#bc4d77"
cyan = "#4a8143"
white = "#4f4430"

# ANSI 8-15.
[colors.bright]
black = "#b4ada2"
red = "#f04028"
green = "#949c1a"
yellow = "#c18311"
blue = "#5e8cb7"
magenta = "#c76b8e"
cyan = "#599c51"
white = "#3a3117"

# Dim colours are blended towards the background rather than darkened, so they
# recede without shifting hue.
[colors.dim]
black = "#e3e1dd"
red = "#e96958"
green = "#9da15b"
yellow = "#ba9756"
blue = "#80a1bf"
magenta = "#d082a0"
cyan = "#80a77b"
white = "#5f5647"

# Orange has no ANSI slot. Index 16 is where gruvbox puts it, so tools that
# already know that convention pick it up.
[[colors.indexed_colors]]
index = 16
color = "#bd560b"
