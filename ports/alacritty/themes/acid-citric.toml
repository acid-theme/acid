# Acid Citric for Alacritty
#
# Generated by acidify from ports/alacritty/acid.toml.tera. Do not edit; edit
# the template, or the palette in crates/acid-palette/src/lib.rs, and re-run
# `make ports`.
#
# Import it from your alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/acid-citric.toml"]

[colors.primary]
background = "#1c1b19"
foreground = "#e2d6b6"
dim_foreground = "#a89e8b"
bright_foreground = "#e8dec5"

[colors.cursor]
text = "#1c1b19"
cursor = "#d9a441"

[colors.vi_mode_cursor]
text = "#1c1b19"
cursor = "#7cad76"

[colors.search.matches]
foreground = "#1c1b19"
background = "#918879"

[colors.search.focused_match]
foreground = "#1c1b19"
background = "#d9a441"

[colors.hints.start]
foreground = "#1c1b19"
background = "#d9a441"

[colors.hints.end]
foreground = "#1c1b19"
background = "#918879"

# Chrome sits behind the editor field, so it follows the flavour's depth axis:
# mantle is lighter than base in acetic, darker in citric.
[colors.footer_bar]
foreground = "#c5b99f"
background = "#151413"

[colors.line_indicator]
foreground = "#c5b99f"
background = "#151413"

[colors.selection]
text = "#e2d6b6"
background = "#433f36"

# ANSI 0-7. `black` is a visible surface rather than the background, so that
# black-on-black text stays legible.
[colors.normal]
black = "#35322b"
red = "#de5a48"
green = "#a3ab2f"
yellow = "#d9a441"
blue = "#7d9cba"
magenta = "#c5839c"
cyan = "#7cad76"
white = "#c5b99f"

# ANSI 8-15.
[colors.bright]
black = "#433f36"
red = "#e4796b"
green = "#c0c93a"
yellow = "#e0b463"
blue = "#98b0c8"
magenta = "#d29fb2"
cyan = "#94bc90"
white = "#e2d6b6"

# Dim colours are blended towards the background rather than darkened, so they
# recede without shifting hue.
[colors.dim]
black = "#282621"
red = "#a4473a"
green = "#7b8028"
yellow = "#a07b35"
blue = "#60758a"
magenta = "#926475"
cyan = "#5f815a"
white = "#a89e8b"

# Orange has no ANSI slot. Index 16 is where gruvbox puts it, so tools that
# already know that convention pick it up.
[[colors.indexed_colors]]
index = 16
color = "#dd7b34"
