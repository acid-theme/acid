# Acid Acetic for Alacritty
#
# Generated by acidify from ports/alacritty/acid.toml.tera. Do not edit; edit
# the template, or the palette in crates/acid-palette/src/lib.rs, and re-run
# `make ports`.
#
# Import it from your alacritty.toml:
#   [general]
#   import = ["~/.config/alacritty/themes/acid-acetic.toml"]

[colors.primary]
background = "#000000"
foreground = "#f2e9d0"
dim_foreground = "#a8a49a"
bright_foreground = "#f6f0e0"

[colors.cursor]
text = "#000000"
cursor = "#ffc832"

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#2fe0b8"

[colors.search.matches]
foreground = "#000000"
background = "#8c8c8c"

[colors.search.focused_match]
foreground = "#000000"
background = "#ffc832"

[colors.hints.start]
foreground = "#000000"
background = "#ffc832"

[colors.hints.end]
foreground = "#000000"
background = "#8c8c8c"

# Chrome sits behind the editor field, so it follows the flavour's depth axis:
# mantle is lighter than base in acetic, darker in citric.
[colors.footer_bar]
foreground = "#cdc7b8"
background = "#0a0a0a"

[colors.line_indicator]
foreground = "#cdc7b8"
background = "#0a0a0a"

[colors.selection]
text = "#f2e9d0"
background = "#3a3a3a"

# ANSI 0-7. `black` is a visible surface rather than the background, so that
# black-on-black text stays legible.
[colors.normal]
black = "#2b2b2b"
red = "#ff4536"
green = "#c9e02b"
yellow = "#ffc832"
blue = "#45b6ff"
magenta = "#ea7fc4"
cyan = "#2fe0b8"
white = "#cdc7b8"

# ANSI 8-15.
[colors.bright]
black = "#3a3a3a"
red = "#ff6b5f"
green = "#d2e54f"
yellow = "#ffd35b"
blue = "#6ec6ff"
magenta = "#f0a2d4"
cyan = "#53e5c4"
white = "#f2e9d0"

# Dim colours are blended towards the background rather than darkened, so they
# recede without shifting hue.
[colors.dim]
black = "#1e1e1e"
red = "#b33026"
green = "#8d9d1e"
yellow = "#b38c23"
blue = "#307fb3"
magenta = "#a45989"
cyan = "#219d81"
white = "#a8a49a"

# Orange has no ANSI slot. Index 16 is where gruvbox puts it, so tools that
# already know that convention pick it up.
[[colors.indexed_colors]]
index = 16
color = "#ff8b1f"
