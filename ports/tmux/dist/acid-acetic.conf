# Acid 0.1.0 — Acetic, for tmux
#
# Generated by acid from ports/tmux/theme.tera. Do not edit; edit the
# template, or the palette in crates/acid-palette/src/lib.rs, and re-run
# `make`.
#
# Colours only; the status line's content, key bindings and options stay in
# the main config. Source it from tmux.conf:
#
#     source-file ~/.config/tmux/acid-acetic.conf
#
# Settings after the source-file line override the theme. Written for tmux 3.8.

# Every role as a user option, so formats in the main config can name them:
#     set -g status-right "#[fg=#{@acid_aqua}]#S"
set -g @acid_flavor "acetic"
set -g @acid_red "#ff4536"
set -g @acid_orange "#ff8b1f"
set -g @acid_yellow "#ffc832"
set -g @acid_green "#c9e02b"
set -g @acid_aqua "#2fe0b8"
set -g @acid_blue "#45b6ff"
set -g @acid_purple "#ea7fc4"
set -g @acid_text "#f2e9d0"
set -g @acid_subtext1 "#c3bba9"
set -g @acid_subtext0 "#a49f95"
set -g @acid_overlay2 "#898989"
set -g @acid_overlay1 "#707070"
set -g @acid_overlay0 "#5a5a5a"
set -g @acid_surface2 "#4a4a4a"
set -g @acid_surface1 "#383838"
set -g @acid_surface0 "#242424"
set -g @acid_base "#000000"
set -g @acid_mantle "#0f0f0f"
set -g @acid_crust "#1c1c1c"

# tmux's own palette. Its built-in screens and every default style draw from
# it. Both sets get the flavour, so the terminal's light or dark report cannot
# swap it for another.
set -g dark-theme-black "#000000"
set -g dark-theme-red "#ff4536"
set -g dark-theme-green "#c9e02b"
set -g dark-theme-yellow "#ffc832"
set -g dark-theme-blue "#45b6ff"
set -g dark-theme-magenta "#ea7fc4"
set -g dark-theme-cyan "#2fe0b8"
set -g dark-theme-white "#f2e9d0"
set -g dark-theme-light-grey "#898989"
set -g dark-theme-dark-grey "#242424"
set -g light-theme-black "#000000"
set -g light-theme-red "#ff4536"
set -g light-theme-green "#c9e02b"
set -g light-theme-yellow "#ffc832"
set -g light-theme-blue "#45b6ff"
set -g light-theme-magenta "#ea7fc4"
set -g light-theme-cyan "#2fe0b8"
set -g light-theme-white "#f2e9d0"
set -g light-theme-light-grey "#898989"
set -g light-theme-dark-grey "#242424"

# Status line
set -g status-style "fg=#a49f95,bg=#0f0f0f"
set -g status-left-style "fg=#f2e9d0,bg=#0f0f0f,bold"
set -g status-right-style "fg=#a49f95,bg=#0f0f0f"

# Windows in the status line
set -g window-status-style "fg=#898989,bg=#0f0f0f"
set -g window-status-last-style "fg=#c3bba9,bg=#0f0f0f"
set -g window-status-current-style "fg=#000000,bg=#45b6ff,bold"
set -g window-status-activity-style "fg=#ff8b1f,bg=#0f0f0f"
set -g window-status-bell-style "fg=#ff4536,bg=#0f0f0f,bold"

# Panes and sessions in a multi-line status line
set -g pane-status-style "fg=#898989,bg=#0f0f0f"
set -g pane-status-current-style "fg=#000000,bg=#45b6ff,bold"
set -g session-status-style "fg=#898989,bg=#0f0f0f"
set -g session-status-current-style "fg=#000000,bg=#45b6ff,bold"

# Pane borders. The active border says what the pane is doing: a popup over it,
# marked, synchronised, in a mode, or none of those.
set -g pane-border-style "fg=#383838"
set -g pane-active-border-style "fg=#{?pane_modal_flag,#2fe0b8,#{?pane_marked,#ea7fc4,#{?synchronize-panes,#ff4536,#{?pane_in_mode,#ffc832,#45b6ff}}}}"
set -g pane-scrollbars-style "fg=#4a4a4a,bg=#0f0f0f,width=1,pad=0"
set -g display-panes-colour "#707070"
set -g display-panes-active-colour "#45b6ff"
set -g display-panes-border-style "fg=#4a4a4a,bg=#0f0f0f"

# Messages and the command prompt. Both fill the status line, except when the
# prompt is drawn inside a pane or a mode.
set -g message-style "fg=#f2e9d0,bg=#242424,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#242424}"
set -g message-command-style "fg=#ffc832,bg=#242424,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#242424}"

# Copy mode. The selection and position indicator follow mode-style.
set -g mode-style "noattr,fg=#f2e9d0,bg=#4a4a4a"
set -g copy-mode-match-style "fg=#000000,bg=#898989"
set -g copy-mode-current-match-style "fg=#000000,bg=#ffc832"
set -g copy-mode-mark-style "fg=#000000,bg=#ea7fc4"
set -g copy-mode-line-number-style "fg=#707070"
set -g copy-mode-current-line-number-style "fg=#ffc832"
set -g switch-mode-match-style "fg=#000000,bg=#2fe0b8"

# Tree mode. The preview outlines the current pane or window in the accent of
# the active border.
set -g tree-mode-border-style "fg=#4a4a4a,bg=#0f0f0f"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#45b6ff,#707070}"

# Menus and popups
set -g menu-style "fg=#f2e9d0,bg=#0f0f0f"
set -g menu-selected-style "fg=#f2e9d0,bg=#4a4a4a"
set -g menu-border-style "fg=#4a4a4a,bg=#0f0f0f"
set -g popup-style "fg=#f2e9d0,bg=#0f0f0f"
set -g popup-border-style "fg=#4a4a4a,bg=#0f0f0f"

# Clock mode
set -g clock-mode-colour "#45b6ff"
