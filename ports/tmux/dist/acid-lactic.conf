# Acid 0.1.0 — Lactic, for tmux
#
# Generated by acid from ports/tmux/theme.tera. Do not edit; edit the
# template, or the palette in crates/acid-palette/src/lib.rs, and re-run
# `make`.
#
# Colours only; the status line's content, key bindings and options stay in
# the main config. Source it from tmux.conf:
#
#     source-file ~/.config/tmux/acid-lactic.conf
#
# Settings after the source-file line override the theme.
#
# Written for tmux 3.8. Every option is set with -q, so an older tmux skips the
# ones it does not have instead of reporting each, and draws the rest.

# Every role as a user option, so formats in the main config can name them:
#     set -g status-right "#[fg=#{@acid_aqua}]#S"
set -gq @acid_flavor "lactic"
set -gq @acid_red "#df2910"
set -gq @acid_orange "#bd560b"
set -gq @acid_yellow "#9c6a0e"
set -gq @acid_green "#737914"
set -gq @acid_aqua "#4a8143"
set -gq @acid_blue "#4978a4"
set -gq @acid_purple "#bc4d77"
set -gq @acid_text "#3a3117"
set -gq @acid_subtext1 "#4f4430"
set -gq @acid_subtext0 "#5f5647"
set -gq @acid_overlay2 "#706a5c"
set -gq @acid_overlay1 "#877e71"
set -gq @acid_overlay0 "#9a958a"
set -gq @acid_surface2 "#b4ada2"
set -gq @acid_surface1 "#cbc6bf"
set -gq @acid_surface0 "#e3e1dd"
set -gq @acid_base "#ffffff"
set -gq @acid_mantle "#f4f4f3"
set -gq @acid_crust "#e8e8e4"

# tmux's own palette. Its built-in screens and every default style draw from
# it. Both sets get the flavour, so the terminal's light or dark report cannot
# swap it for another.
set -gq dark-theme-black "#ffffff"
set -gq dark-theme-red "#df2910"
set -gq dark-theme-green "#737914"
set -gq dark-theme-yellow "#9c6a0e"
set -gq dark-theme-blue "#4978a4"
set -gq dark-theme-magenta "#bc4d77"
set -gq dark-theme-cyan "#4a8143"
set -gq dark-theme-white "#3a3117"
set -gq dark-theme-light-grey "#706a5c"
set -gq dark-theme-dark-grey "#e3e1dd"
set -gq light-theme-black "#ffffff"
set -gq light-theme-red "#df2910"
set -gq light-theme-green "#737914"
set -gq light-theme-yellow "#9c6a0e"
set -gq light-theme-blue "#4978a4"
set -gq light-theme-magenta "#bc4d77"
set -gq light-theme-cyan "#4a8143"
set -gq light-theme-white "#3a3117"
set -gq light-theme-light-grey "#706a5c"
set -gq light-theme-dark-grey "#e3e1dd"

# Status line
set -gq status-style "fg=#5f5647,bg=#f4f4f3"
set -gq status-left-style "fg=#3a3117,bg=#f4f4f3,bold"
set -gq status-right-style "fg=#5f5647,bg=#f4f4f3"

# Windows in the status line
set -gq window-status-style "fg=#706a5c,bg=#f4f4f3"
set -gq window-status-last-style "fg=#4f4430,bg=#f4f4f3"
set -gq window-status-current-style "fg=#ffffff,bg=#4978a4,bold"
set -gq window-status-activity-style "fg=#bd560b,bg=#f4f4f3"
set -gq window-status-bell-style "fg=#df2910,bg=#f4f4f3,bold"

# Panes and sessions in a multi-line status line
set -gq pane-status-style "fg=#706a5c,bg=#f4f4f3"
set -gq pane-status-current-style "fg=#ffffff,bg=#4978a4,bold"
set -gq session-status-style "fg=#706a5c,bg=#f4f4f3"
set -gq session-status-current-style "fg=#ffffff,bg=#4978a4,bold"

# Pane borders. The active border says what the pane is doing: a popup over it,
# marked, synchronised, in a mode, or none of those.
set -gq pane-border-style "fg=#cbc6bf"
set -gq pane-active-border-style "fg=#{?pane_modal_flag,#4a8143,#{?pane_marked,#bc4d77,#{?synchronize-panes,#df2910,#{?pane_in_mode,#9c6a0e,#4978a4}}}}"
set -gq pane-scrollbars-style "fg=#b4ada2,bg=#f4f4f3,width=1,pad=0"
set -gq display-panes-colour "#877e71"
set -gq display-panes-active-colour "#4978a4"
set -gq display-panes-border-style "fg=#b4ada2,bg=#f4f4f3"

# Messages and the command prompt. Both fill the status line, except when the
# prompt is drawn inside a pane or a mode.
set -gq message-style "fg=#3a3117,bg=#e3e1dd,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#e3e1dd}"
set -gq message-command-style "fg=#9c6a0e,bg=#e3e1dd,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#e3e1dd}"

# Copy mode. The selection and position indicator follow mode-style.
set -gq mode-style "fg=#3a3117,bg=#b4ada2"
set -gq copy-mode-match-style "fg=#ffffff,bg=#706a5c"
set -gq copy-mode-current-match-style "fg=#ffffff,bg=#9c6a0e"
set -gq copy-mode-mark-style "fg=#ffffff,bg=#bc4d77"
set -gq copy-mode-line-number-style "fg=#877e71"
set -gq copy-mode-current-line-number-style "fg=#9c6a0e"
set -gq switch-mode-match-style "fg=#ffffff,bg=#4a8143"

# Tree mode. The preview outlines the current pane or window in the accent of
# the active border.
set -gq tree-mode-border-style "fg=#b4ada2,bg=#f4f4f3"
set -gq tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#4978a4,#877e71}"

# Menus and popups
set -gq menu-style "fg=#3a3117,bg=#f4f4f3"
set -gq menu-selected-style "fg=#3a3117,bg=#b4ada2"
set -gq menu-border-style "fg=#b4ada2,bg=#f4f4f3"
set -gq popup-style "fg=#3a3117,bg=#f4f4f3"
set -gq popup-border-style "fg=#b4ada2,bg=#f4f4f3"

# Clock mode
set -gq clock-mode-colour "#4978a4"
