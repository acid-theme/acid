# Acid 0.1.0 — Citric, for tmux
#
# Generated by acid from ports/tmux/theme.tera. Do not edit; edit the
# template, or the palette in crates/acid-palette/src/lib.rs, and re-run
# `make`.
#
# Colours only; the status line's content, key bindings and options stay in
# the main config. Source it from tmux.conf:
#
#     source-file ~/.config/tmux/acid-citric.conf
#
# Settings after the source-file line override the theme.
#
# Written for tmux 3.8. Every option is set with -q, so an older tmux skips the
# ones it does not have instead of reporting each, and draws the rest.

# Every role as a user option, so formats in the main config can name them:
#     set -g status-right "#[fg=#{@acid_aqua}]#S"
set -gq @acid_flavor "citric"
set -gq @acid_red "#de5a48"
set -gq @acid_orange "#dd7b34"
set -gq @acid_yellow "#d9a441"
set -gq @acid_green "#a3ab2f"
set -gq @acid_aqua "#7cad76"
set -gq @acid_blue "#7d9cba"
set -gq @acid_purple "#c5839c"
set -gq @acid_text "#e2d6b6"
set -gq @acid_subtext1 "#cabea7"
set -gq @acid_subtext0 "#b4ab9b"
set -gq @acid_overlay2 "#9f988a"
set -gq @acid_overlay1 "#857d70"
set -gq @acid_overlay0 "#6b665c"
set -gq @acid_surface2 "#5b554a"
set -gq @acid_surface1 "#49443b"
set -gq @acid_surface0 "#35332c"
set -gq @acid_base "#1c1b19"
set -gq @acid_mantle "#121211"
set -gq @acid_crust "#060605"

# tmux's own palette. Its built-in screens and every default style draw from
# it. Both sets get the flavour, so the terminal's light or dark report cannot
# swap it for another.
set -gq dark-theme-black "#1c1b19"
set -gq dark-theme-red "#de5a48"
set -gq dark-theme-green "#a3ab2f"
set -gq dark-theme-yellow "#d9a441"
set -gq dark-theme-blue "#7d9cba"
set -gq dark-theme-magenta "#c5839c"
set -gq dark-theme-cyan "#7cad76"
set -gq dark-theme-white "#e2d6b6"
set -gq dark-theme-light-grey "#9f988a"
set -gq dark-theme-dark-grey "#35332c"
set -gq light-theme-black "#1c1b19"
set -gq light-theme-red "#de5a48"
set -gq light-theme-green "#a3ab2f"
set -gq light-theme-yellow "#d9a441"
set -gq light-theme-blue "#7d9cba"
set -gq light-theme-magenta "#c5839c"
set -gq light-theme-cyan "#7cad76"
set -gq light-theme-white "#e2d6b6"
set -gq light-theme-light-grey "#9f988a"
set -gq light-theme-dark-grey "#35332c"

# Status line
set -gq status-style "fg=#b4ab9b,bg=#121211"
set -gq status-left-style "fg=#e2d6b6,bg=#121211,bold"
set -gq status-right-style "fg=#b4ab9b,bg=#121211"

# Windows in the status line
set -gq window-status-style "fg=#9f988a,bg=#121211"
set -gq window-status-last-style "fg=#cabea7,bg=#121211"
set -gq window-status-current-style "fg=#1c1b19,bg=#7d9cba,bold"
set -gq window-status-activity-style "fg=#dd7b34,bg=#121211"
set -gq window-status-bell-style "fg=#de5a48,bg=#121211,bold"

# Panes and sessions in a multi-line status line
set -gq pane-status-style "fg=#9f988a,bg=#121211"
set -gq pane-status-current-style "fg=#1c1b19,bg=#7d9cba,bold"
set -gq session-status-style "fg=#9f988a,bg=#121211"
set -gq session-status-current-style "fg=#1c1b19,bg=#7d9cba,bold"

# Pane borders. The active border says what the pane is doing: a popup over it,
# marked, synchronised, in a mode, or none of those.
set -gq pane-border-style "fg=#49443b"
set -gq pane-active-border-style "fg=#{?pane_modal_flag,#7cad76,#{?pane_marked,#c5839c,#{?synchronize-panes,#de5a48,#{?pane_in_mode,#d9a441,#7d9cba}}}}"
set -gq pane-scrollbars-style "fg=#5b554a,bg=#121211,width=1,pad=0"
set -gq display-panes-colour "#857d70"
set -gq display-panes-active-colour "#7d9cba"
set -gq display-panes-border-style "fg=#5b554a,bg=#121211"

# Messages and the command prompt. Both fill the status line, except when the
# prompt is drawn inside a pane or a mode.
set -gq message-style "fg=#e2d6b6,bg=#35332c,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#35332c}"
set -gq message-command-style "fg=#d9a441,bg=#35332c,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#35332c}"

# Copy mode. The selection and position indicator follow mode-style.
set -gq mode-style "fg=#e2d6b6,bg=#5b554a"
set -gq copy-mode-match-style "fg=#1c1b19,bg=#9f988a"
set -gq copy-mode-current-match-style "fg=#1c1b19,bg=#d9a441"
set -gq copy-mode-mark-style "fg=#1c1b19,bg=#c5839c"
set -gq copy-mode-line-number-style "fg=#857d70"
set -gq copy-mode-current-line-number-style "fg=#d9a441"
set -gq switch-mode-match-style "fg=#1c1b19,bg=#7cad76"

# Tree mode. The preview outlines the current pane or window in the accent of
# the active border.
set -gq tree-mode-border-style "fg=#5b554a,bg=#121211"
set -gq tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#7d9cba,#857d70}"

# Menus and popups
set -gq menu-style "fg=#e2d6b6,bg=#121211"
set -gq menu-selected-style "fg=#e2d6b6,bg=#5b554a"
set -gq menu-border-style "fg=#5b554a,bg=#121211"
set -gq popup-style "fg=#e2d6b6,bg=#121211"
set -gq popup-border-style "fg=#5b554a,bg=#121211"

# Clock mode
set -gq clock-mode-colour "#7d9cba"
