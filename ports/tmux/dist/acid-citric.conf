# Acid 0.1.0 — Citric, for tmux
#
# Generated by acid from ports/tmux/theme.tera. Do not edit; edit the
# template, or the palette in crates/acid-palette/src/lib.rs, and re-run
# `make`.
#
# Colours only; the status line's content, key bindings and options stay in
# the main config. Source it from tmux.conf:
#
#     source-file ~/.config/tmux/acid-citric.conf
#
# Settings after the source-file line override the theme. Written for tmux 3.8.

# Every role as a user option, so formats in the main config can name them:
#     set -g status-right "#[fg=#{@acid_aqua}]#S"
set -g @acid_flavor "citric"
set -g @acid_red "#de5a48"
set -g @acid_orange "#dd7b34"
set -g @acid_yellow "#d9a441"
set -g @acid_green "#a3ab2f"
set -g @acid_aqua "#7cad76"
set -g @acid_blue "#7d9cba"
set -g @acid_purple "#c5839c"
set -g @acid_text "#e2d6b6"
set -g @acid_subtext1 "#cabea7"
set -g @acid_subtext0 "#b4ab9b"
set -g @acid_overlay2 "#9f988a"
set -g @acid_overlay1 "#857d70"
set -g @acid_overlay0 "#6b665c"
set -g @acid_surface2 "#5b554a"
set -g @acid_surface1 "#49443b"
set -g @acid_surface0 "#35332c"
set -g @acid_base "#1c1b19"
set -g @acid_mantle "#121211"
set -g @acid_crust "#060605"

# tmux's own palette. Its built-in screens and every default style draw from
# it. Both sets get the flavour, so the terminal's light or dark report cannot
# swap it for another.
set -g dark-theme-black "#1c1b19"
set -g dark-theme-red "#de5a48"
set -g dark-theme-green "#a3ab2f"
set -g dark-theme-yellow "#d9a441"
set -g dark-theme-blue "#7d9cba"
set -g dark-theme-magenta "#c5839c"
set -g dark-theme-cyan "#7cad76"
set -g dark-theme-white "#e2d6b6"
set -g dark-theme-light-grey "#9f988a"
set -g dark-theme-dark-grey "#35332c"
set -g light-theme-black "#1c1b19"
set -g light-theme-red "#de5a48"
set -g light-theme-green "#a3ab2f"
set -g light-theme-yellow "#d9a441"
set -g light-theme-blue "#7d9cba"
set -g light-theme-magenta "#c5839c"
set -g light-theme-cyan "#7cad76"
set -g light-theme-white "#e2d6b6"
set -g light-theme-light-grey "#9f988a"
set -g light-theme-dark-grey "#35332c"

# Status line
set -g status-style "fg=#b4ab9b,bg=#121211"
set -g status-left-style "fg=#e2d6b6,bg=#121211,bold"
set -g status-right-style "fg=#b4ab9b,bg=#121211"

# Windows in the status line
set -g window-status-style "fg=#9f988a,bg=#121211"
set -g window-status-last-style "fg=#cabea7,bg=#121211"
set -g window-status-current-style "fg=#1c1b19,bg=#7d9cba,bold"
set -g window-status-activity-style "fg=#dd7b34,bg=#121211"
set -g window-status-bell-style "fg=#de5a48,bg=#121211,bold"

# Panes and sessions in a multi-line status line
set -g pane-status-style "fg=#9f988a,bg=#121211"
set -g pane-status-current-style "fg=#1c1b19,bg=#7d9cba,bold"
set -g session-status-style "fg=#9f988a,bg=#121211"
set -g session-status-current-style "fg=#1c1b19,bg=#7d9cba,bold"

# Pane borders. The active border says what the pane is doing: a popup over it,
# marked, synchronised, in a mode, or none of those.
set -g pane-border-style "fg=#49443b"
set -g pane-active-border-style "fg=#{?pane_modal_flag,#7cad76,#{?pane_marked,#c5839c,#{?synchronize-panes,#de5a48,#{?pane_in_mode,#d9a441,#7d9cba}}}}"
set -g pane-scrollbars-style "fg=#5b554a,bg=#121211,width=1,pad=0"
set -g display-panes-colour "#857d70"
set -g display-panes-active-colour "#7d9cba"
set -g display-panes-border-style "fg=#5b554a,bg=#121211"

# Messages and the command prompt. Both fill the status line, except when the
# prompt is drawn inside a pane or a mode.
set -g message-style "fg=#e2d6b6,bg=#35332c,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#35332c}"
set -g message-command-style "fg=#d9a441,bg=#35332c,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#35332c}"

# Copy mode. The selection and position indicator follow mode-style.
set -g mode-style "noattr,fg=#e2d6b6,bg=#5b554a"
set -g copy-mode-match-style "fg=#1c1b19,bg=#9f988a"
set -g copy-mode-current-match-style "fg=#1c1b19,bg=#d9a441"
set -g copy-mode-mark-style "fg=#1c1b19,bg=#c5839c"
set -g copy-mode-line-number-style "fg=#857d70"
set -g copy-mode-current-line-number-style "fg=#d9a441"
set -g switch-mode-match-style "fg=#1c1b19,bg=#7cad76"

# Tree mode. The preview outlines the current pane or window in the accent of
# the active border.
set -g tree-mode-border-style "fg=#5b554a,bg=#121211"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#7d9cba,#857d70}"

# Menus and popups
set -g menu-style "fg=#e2d6b6,bg=#121211"
set -g menu-selected-style "fg=#e2d6b6,bg=#5b554a"
set -g menu-border-style "fg=#5b554a,bg=#121211"
set -g popup-style "fg=#e2d6b6,bg=#121211"
set -g popup-border-style "fg=#5b554a,bg=#121211"

# Clock mode
set -g clock-mode-colour "#7d9cba"
