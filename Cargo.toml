[workspace]
resolver = "3"
members = ["crates/acid-palette", "crates/acidify"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ssiyad/acid"
authors = ["ssiyad <hello@ssiyad.com>"]

[workspace.dependencies]
acid-palette = { path = "crates/acid-palette" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
